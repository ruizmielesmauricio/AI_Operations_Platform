[project]
name = "aiops-backend"
version = "0.1.0"
description = "AI Operations Platform — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9",
    "stripe>=11.0",
    "boto3>=1.34",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "httpx>=0.27",
    # Offline lat/lon -> IANA timezone lookup for app/geocoding/ — no
    # network call, no extra provider dependency, and no second vendor's
    # timezone guess to reconcile against Geoapify's own address match.
    "timezonefinder>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
