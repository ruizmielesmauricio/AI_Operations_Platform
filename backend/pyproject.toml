[project]
name = "aiops-backend"
version = "0.1.0"
description = "AI Operations Platform — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9",
    "stripe>=11.0",
    "boto3>=1.34",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "httpx>=0.27",
    # Offline lat/lon -> IANA timezone lookup for app/geocoding/ — no
    # network call, no extra provider dependency, and no second vendor's
    # timezone guess to reconcile against Geoapify's own address match.
    "timezonefinder>=6.5",
    # Real, server-generated report exports (ORLA Notifications/Security/
    # Retention prompt, section 7) — replacing the existing "Download
    # PDF" button's browser-print (frontend/app/reports/[id]/page.tsx,
    # v1.28) with an actual file the backend enforces permissions on, not
    # just a client-side print dialog. Both are pure-Python wheels — no
    # native system libraries (e.g. no cairo/pango, unlike weasyprint),
    # so no Docker image changes needed.
    "reportlab>=4.2",
    "python-docx>=1.1",
    # Required by FastAPI/Starlette to parse multipart/form-data bodies —
    # the company-logo upload route (app/api/businesses.py::upload_logo)
    # is this app's first UploadFile route; every prior file upload
    # (imports) used a presigned R2 PUT URL instead, so this was never
    # needed before.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
