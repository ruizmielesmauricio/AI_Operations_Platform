services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiops_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aiops:aiops_dev_password@db:5432/aiops_dev}
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    # Stage D17/D18 — a separate lightweight service (same backend image,
    # different entrypoint) that polls for weekly/monthly reports coming
    # due, rather than an in-process FastAPI background task. Decoupled
    # from the API process on purpose: it can restart, fall behind, or
    # scale independently without affecting request handling, and a
    # single reconciliation tick covers scheduling (PR-8.1/8.2), retry
    # (PR-8.9), and recovery after downtime (PR-8.10) — see
    # app/scheduler/tick.py.
    build: ./backend
    command: python -m app.scheduler
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aiops:aiops_dev_password@db:5432/aiops_dev}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres-data:
