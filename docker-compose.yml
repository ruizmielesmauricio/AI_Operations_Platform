services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiops_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aiops:aiops_dev_password@db:5432/aiops_dev}
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    # Stage D17/D18 — a separate lightweight service (same backend image,
    # different entrypoint) that polls for weekly/monthly reports coming
    # due, rather than an in-process FastAPI background task. Decoupled
    # from the API process on purpose: it can restart, fall behind, or
    # scale independently without affecting request handling, and a
    # single reconciliation tick covers scheduling (PR-8.1/8.2), retry
    # (PR-8.9), and recovery after downtime (PR-8.10) — see
    # app/scheduler/tick.py.
    build: ./backend
    command: python -m app.scheduler
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aiops:aiops_dev_password@db:5432/aiops_dev}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  stripe-cli:
    # Local-dev-only: forwards Stripe test-mode events to the webhook
    # route, since Stripe can't reach localhost directly. Found live
    # 14/08/2026 — a real employee-seat payment got stuck in
    # pending_payment because nobody had this running in a terminal;
    # this service exists so it comes up automatically with the rest of
    # the stack instead of depending on a human remembering a manual
    # command. Not needed at all once actually deployed — production
    # Stripe posts straight to the real public URL, registered directly
    # in the Stripe Dashboard with its own live-mode signing secret; this
    # service and STRIPE_WEBHOOK_SECRET's current value are dev-only.
    #
    # Authenticates with the TEST secret key from backend/.env (never a
    # live key) instead of a host `stripe login` folder, so it works on any
    # machine with no extra setup (found 12/11/2026: no ~/.config/stripe on
    # a fresh Windows machine). Pinned, because newer CLIs changed `listen`
    # and refuse to start without an explicit event list. The events are
    # exactly the six app/billing/service.py handles.
    #
    # STRIPE_WEBHOOK_SECRET in backend/.env must match this listener's
    # signing secret; it is stable per account/key. Print it once with:
    #   docker compose run --rm --no-deps stripe-cli 'stripe listen --api-key "$STRIPE_SECRET_KEY" --print-secret'
    image: stripe/stripe-cli:v1.55.11
    env_file:
      - path: ./backend/.env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        stripe listen --api-key "$$STRIPE_SECRET_KEY"
        --events checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.paid,invoice.payment_failed
        --forward-to backend:8000/billing/webhooks/stripe
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
